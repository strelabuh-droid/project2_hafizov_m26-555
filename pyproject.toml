[project]
name = "primitive-db"
version = "0.1.0"
description = "Учебная консольная база данных с хранением в JSON"
readme = "README.md"
authors = [{name = "Артур Хафизов"}]
requires-python = ">=3.12"
dependencies = ["prompt==0.4.1", "prettytable==3.18.0"]

[project.scripts]
project = "primitive_db.main:main"
database = "primitive_db.main:main"

[dependency-groups]
dev = ["ruff==0.17.1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []